worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile   on;
    gzip       on;
    gzip_types text/plain text/css application/javascript application/json;
    keepalive_timeout 65;

    # ── upstream: FastAPI backend ─────────────────────────────────────
    upstream api {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index "Shayak Film.dc.html";

        # ── Proxy /api/* and /health → FastAPI ───────────────────────
        location /api/ {
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://api/health;
        }

        # ── Security headers (HIGH FIX: CSP, frame-ancestors) ───────
        add_header X-Content-Type-Options    "nosniff"                              always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header X-XSS-Protection          "1; mode=block"                        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-eval' https://fonts.googleapis.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            always;

        # ── Static assets ────────────────────────────────────────────
        location ~* \.(js|jsx|css|png|jpg|svg|woff2|ico|json)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /Shayak%20Film.dc.html;
        }
    }
}
