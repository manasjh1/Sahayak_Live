# Local run of the container (database is Supabase)
#   DATABASE_URL='postgresql://...pooler.supabase.com:5432/postgres' \
#     docker compose -f docker-compose.single.yml up --build
services:
  shayak:
    build: .
    image: shayak:latest
    container_name: shayak
    restart: unless-stopped
    environment:
      DATABASE_URL:  ${DATABASE_URL:?set DATABASE_URL (Supabase Session pooler URI)}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CORS_ORIGINS:  ${CORS_ORIGINS:-*}
      ENV:           ${ENV:-development}
    ports:
      - "${FRONTEND_PORT:-80}:10000"
