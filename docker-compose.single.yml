# Single-container deployment (nginx + FastAPI + PostgreSQL in one image)
#   docker compose -f docker-compose.single.yml up --build -d
services:
  shayak:
    build: .
    image: shayak:latest
    container_name: shayak
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-shayak_waitlist}
      POSTGRES_USER:     ${POSTGRES_USER:-shayak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ADMIN_API_KEY:     ${ADMIN_API_KEY:-}
      CORS_ORIGINS:      ${CORS_ORIGINS:-*}
      ENV:               ${ENV:-development}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
